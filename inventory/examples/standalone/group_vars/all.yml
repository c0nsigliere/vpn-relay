---
# =============================================================================
# Standalone Deployment — Shared Variables
# =============================================================================
# Single-server setup: XRay + Bot + TMA, no cascade / relay / WireGuard.
# Copy this directory to inventory/<your-deployment>/ and fill in real values.

# --- REQUIRED: This server's public IP ---
server_b_public_ip: "YOUR_SERVER_PUBLIC_IP"

# --- Country code (optional — auto-detected from server IP via GeoIP at deploy) ---
# server_b_country: "NL"

# --- Firewall mode ---
# "keep"    — UFW stays enabled; NAT rules in /etc/ufw/before.rules
# "disable" — UFW disabled; rules via iptables-persistent
manage_ufw: "keep"

# --- WAN interface override (comment out for auto-detection) ---
# wan_if: "eth0"

# --- Maintenance ---
do_dist_upgrade: false
manage_unattended_upgrades: "leave"
maintenance_reboot: true

# On-demand update/reboot from the bot & TMA. Shared by roles/maintenance (installs
# the root helper) and roles/telegram_bot (installs the path units that trigger it).
maintenance_agent_bin: /usr/local/sbin/vpn-maintenance
maintenance_state_dir: /var/lib/vpn-maintenance   # persistent: job status survives a reboot
maintenance_trigger_dir: /run/vpn-maintenance     # tmpfs: a trigger must NOT survive a reboot

# --- Telegram Bot (optional — deploy with deploy_bot.yml) ---
# Create a bot via @BotFather; get your admin chat ID from @userinfobot
# bot_telegram_token: "YOUR_BOT_TOKEN"
# bot_admin_id: "YOUR_TELEGRAM_USER_ID"

# --- Telegram Mini App (optional — deploy with deploy_tma.yml) ---
# tma_domain: "tma.example.com"
# tma_certbot_email: "you@example.com"
tma_https_port: 8444
tma_backend_port: 3000

# --- Ports ---
# XRay listens on 443 to look like normal HTTPS (DPI evasion)
xray_port: 443

# --- XRay version ---
xray_version: "26.2.6"

# --- Hysteria 2 (sing-box) — optional UDP/QUIC protocol, strong vs DPI throttling ---
# When enabled, sing-box runs alongside XRay (XRay 443/tcp, Hy2 443/udp — no conflict).
# Requires a real domain (hy2_domain) with an A-record to this server for the TLS cert
# (Let's Encrypt via the tls_cert role). sing-box is built from source with with_v2ray_api.
hy2_enabled: false
hy2_port: 443
# SNI + certificate domain. Defaults to tma_domain so one cert covers both; override to split.
hy2_domain: "{{ tma_domain | default('') }}"
# Public host clients dial (IP or domain). Hy2 validates the cert by sni=, not host.
hy2_host: "{{ server_b_public_ip }}"
# Pinned sing-box tag — latest STABLE (the 1.14.0 line is alpha-only). Bump deliberately.
singbox_version: "1.13.14"
singbox_v2ray_api_port: 10086
# "info" lets the bot parse Hy2 client source IPs from the log (phase 2). Use
# "warn" to cut log volume at the cost of no IP/ISP for Hy2 clients.
singbox_log_level: "info"
# hy2_uplink_password: ""   # phase 3 (WG-over-Hy2 cascade) only; empty in phase 1
