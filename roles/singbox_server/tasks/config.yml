---
# Template the sing-box config.json (static scaffold — bot clients come from DB).
#
# The `users` and experimental.v2ray_api.stats.users lists are templated empty:
# the bot rebuilds them from the DB on startup and on every client mutation.

- name: Ensure sing-box log directory exists
  ansible.builtin.file:
    path: /var/log/sing-box
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags: [config, hy2]

- name: Grant vpn-bot read access to sing-box log (Hy2 client IP extraction, phase 2)
  ansible.builtin.acl:
    path: /var/log/sing-box/sing-box.log
    entity: "{{ bot_user | default('vpn-bot') }}"
    etype: user
    permissions: r
    state: present
  failed_when: false  # log file may not exist yet on fresh install
  tags: [config, hy2]

- name: Deploy sing-box logrotate config
  ansible.builtin.template:
    src: logrotate-sing-box.j2
    dest: /etc/logrotate.d/sing-box
    mode: '0644'
    owner: root
    group: root
  tags: [config, hy2]

- name: Ensure sing-box config directory exists
  ansible.builtin.file:
    path: "{{ singbox_config_dir }}"
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Template sing-box config.json
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ singbox_config_file }}"
    mode: '0600'
    owner: root
    group: root
  notify:
    - restart sing-box
    - restart vpn-bot
  no_log: true

# The template module replaces the file atomically (new inode), which drops any
# ACL previously set by the telegram_bot role — without this the bot loses write
# access to config.json until the next deploy_bot run.
- name: Re-apply vpn-bot read/write ACL on config.json
  ansible.builtin.acl:
    path: "{{ singbox_config_file }}"
    entity: "{{ bot_user | default('vpn-bot') }}"
    etype: user
    permissions: rw
    state: present
  failed_when: false  # bot user may not exist yet on fresh install; telegram_bot role sets ACLs later
  tags: [config, hy2]
