---
# Maintenance role defaults

# Whether to run dist-upgrade (may remove packages to resolve dependencies).
# Default: false (safe upgrade only - never removes packages)
# Override at runtime: -e "do_dist_upgrade=true"
# Use only during scheduled maintenance windows.
do_dist_upgrade: false

# Manage the unattended-upgrades package:
#   "leave"  - Не трогать пакет. Headless hygiene (timers, Prompt=never) всё равно применяется.
#   "true"   - Установить + включить + деплоить overlay (security-only, no auto-reboot).
#   "false"  - Отключить. Overlay удаляется.
manage_unattended_upgrades: "true"

# Reboot the server after maintenance if /var/run/reboot-required exists.
# Default: true (required for kernel updates to take effect)
# Set to false to defer reboots to a separate scheduled window.
# Override at runtime: -e "maintenance_reboot=false"
maintenance_reboot: true

# --- On-demand maintenance agent (bot/TMA-triggered apt + reboot) ---
# The three paths (maintenance_agent_bin / _state_dir / _trigger_dir) are shared
# with roles/telegram_bot and therefore live in group_vars/all.yml, not here.

# How long apt waits for a lock held by unattended-upgrades before giving up.
# 600s comfortably outlasts a typical unattended security run.
maintenance_apt_lock_timeout: 600

# How many finished jobs (status JSON + log) to keep in maintenance_state_dir/jobs.
maintenance_job_retention: 20

# Manage fail2ban SSH brute-force protection:
#   "true"  - Install + configure SSH jail + enable service.
#   "false" - Stop + disable + remove config.
#   other   - Skip (leave current state untouched).
manage_fail2ban: "true"
fail2ban_sshd_maxretry: 3       # tight: key-only auth → false positive near-impossible
fail2ban_sshd_findtime: 300     # 5 min window
fail2ban_sshd_bantime: 3600     # 1 hour ban
