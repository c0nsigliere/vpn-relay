---
# The maintenance path units below are useless without the helper script they exec.
# deploy_bot.yml runs this role alone, so pull the agent in from roles/maintenance
# here. import_role (not include_tasks by path) is deliberate: it loads that role's
# defaults — maintenance_apt_lock_timeout / maintenance_job_retention — which the
# helper template needs, and being static it propagates these tags to the imported
# tasks without an `apply:` block.
- name: Ensure the maintenance agent is installed (shared with roles/maintenance)
  import_role:
    name: maintenance
    tasks_from: agent
  tags: [service, bot]

- name: Install vpn-bot systemd service
  template:
    src: vpn-bot.service.j2
    dest: /etc/systemd/system/vpn-bot.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart vpn-bot
  tags: [service, bot]

- name: Install xray-restart.service (triggered by path unit)
  template:
    src: xray-restart.service.j2
    dest: /etc/systemd/system/xray-restart.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd
  tags: [service, bot]

- name: Install xray-restart.path (watches /run/vpn-bot/xray-restart)
  template:
    src: xray-restart.path.j2
    dest: /etc/systemd/system/xray-restart.path
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd
  tags: [service, bot]

- name: Enable and start xray-restart.path
  systemd:
    name: xray-restart.path
    enabled: true
    state: started
    daemon_reload: true
  tags: [service, bot]

# sing-box restart path unit — mirror of the XRay one, gated on hy2_enabled.
- name: Install singbox-restart.service (triggered by path unit)
  template:
    src: singbox-restart.service.j2
    dest: /etc/systemd/system/singbox-restart.service
    owner: root
    group: root
    mode: "0644"
  when: hy2_enabled | default(false) | bool
  notify: reload systemd
  tags: [service, bot]

- name: Install singbox-restart.path (watches /run/vpn-bot/singbox-restart)
  template:
    src: singbox-restart.path.j2
    dest: /etc/systemd/system/singbox-restart.path
    owner: root
    group: root
    mode: "0644"
  when: hy2_enabled | default(false) | bool
  notify: reload systemd
  tags: [service, bot]

- name: Enable and start singbox-restart.path
  systemd:
    name: singbox-restart.path
    enabled: true
    state: started
    daemon_reload: true
  when: hy2_enabled | default(false) | bool
  tags: [service, bot]

# On-demand maintenance — one path+oneshot pair per action. The action is encoded in
# the trigger filename AND in the unit's ExecStart, so the allowlist is enforced by
# systemd topology: root never parses an action string supplied by the bot.
- name: Install vpn-maintenance oneshot services (one per action)
  template:
    src: vpn-maintenance.service.j2
    dest: "/etc/systemd/system/vpn-maintenance-{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ bot_maintenance_actions }}"
  notify: reload systemd
  tags: [service, bot]

- name: Install vpn-maintenance path units (watch {{ maintenance_trigger_dir }}/req-<action>)
  template:
    src: vpn-maintenance.path.j2
    dest: "/etc/systemd/system/vpn-maintenance-{{ item }}.path"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ bot_maintenance_actions }}"
  notify: reload systemd
  tags: [service, bot]

- name: Enable and start vpn-maintenance path units
  systemd:
    name: "vpn-maintenance-{{ item }}.path"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ bot_maintenance_actions }}"
  tags: [service, bot]

- name: Enable and start vpn-bot service
  systemd:
    name: vpn-bot
    enabled: true
    state: started
    daemon_reload: true
  tags: [service, bot]
