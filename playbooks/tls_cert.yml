---
# Issue Let's Encrypt certificates (certbot --standalone, HTTP-01) on the exit node.
#
# Runs before singbox_server (which asserts the cert exists) and before nginx_tma
# (which consumes it). Requires port 80 reachable and free.
#
# Usage:
#   ansible-playbook playbooks/tls_cert.yml -i inventory/<deployment>/

- name: Issue TLS certificates via Let's Encrypt (standalone)
  hosts: xray_servers
  become: true
  roles:
    - role: tls_cert
      when: (tma_domain | default('') | length > 0) or (hy2_domain | default('') | length > 0)
  tags:
    - tls
    - certbot
