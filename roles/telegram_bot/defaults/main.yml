---
# Telegram bot deployment role defaults

# Application directory (synced from bot/ in repo)
bot_app_dir: "/opt/vpn-bot"

# Persistent data directory (survives re-deploys)
bot_data_dir: "/var/lib/vpn-bot"

# System user to run the bot
bot_user: "vpn-bot"
bot_group: "vpn-bot"

# SSH keypair for bot → Server A access
bot_ssh_key_path: "/var/lib/vpn-bot/.ssh/id_ed25519"

# Backups — daily encrypted DR bundle to the admin's Telegram chat + local rotation.
# Defined here rather than in group_vars so existing inventories need no edit at all;
# override any of them per-deployment when the defaults don't fit.
backup_enabled: true
backup_hour_utc: 3
backup_retention: 7
bot_backup_dir: "{{ bot_data_dir }}/backups"
# The passphrase is a file, not an .env value: it mirrors the sing-box obfs idiom and
# gives the DR runbook one canonical artifact to save off the node.
bot_backup_passphrase_file: "{{ bot_data_dir }}/backup.passphrase"

# Node.js version
node_major_version: 24

# pnpm version — pinned for deterministic installs. Must be 11.x (the repo's
# pnpm-workspace.yaml uses the pnpm-11 `allowBuilds` map for native deps).
pnpm_version: "11.12.0"

# XRay file paths (must match xray_server role)
xray_config_dir: "/etc/xray"
xray_keys_dir: "/etc/xray/keys"
xray_api_port: 10085

# sing-box / Hysteria 2 (must match singbox_server role). hy2_enabled gates all
# Hy2 wiring: ACLs, ReadWritePaths, the restart path unit and the env block.
hy2_enabled: false
singbox_config_dir: "/etc/sing-box"
singbox_config_file: "/etc/sing-box/config.json"
singbox_obfs_file: "/etc/sing-box/obfs.pw"
singbox_v2ray_api_port: 10086

# Bot Telegram credentials — MUST be overridden in vault or extra vars
bot_telegram_token: ""
bot_admin_id: ""

# DPI evasion params — must match xray_server role defaults
xray_sni: "www.googletagmanager.com"
xray_fingerprint: "chrome"
xray_flow: "xtls-rprx-vision"

# On-demand maintenance actions. One systemd path+oneshot pair is rendered per entry;
# the action is part of the unit's ExecStart, so this list IS the root allowlist.
bot_maintenance_actions:
  - update
  - update-reboot
  - reboot

# TMA (Telegram Mini App) — leave empty to disable
tma_domain: ""
tma_https_port: 8444
tma_backend_port: 3000
