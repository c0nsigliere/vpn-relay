---
- name: Create bot app directory
  file:
    path: "{{ bot_app_dir }}"
    state: directory
    owner: "{{ bot_user }}"
    group: "{{ bot_group }}"
    mode: "0755"
  tags: [deploy, bot]

- name: Sync bot source code
  shell: >
    rsync -az --delete
    --rsync-path="sudo rsync"
    --exclude=node_modules
    --exclude=dist
    --exclude='*.tsbuildinfo'
    --exclude=.env
    --exclude='*.db'
    {{ playbook_dir }}/../bot/
    {{ ansible_user | default('root') }}@{{ ansible_host }}:{{ bot_app_dir }}/
  delegate_to: localhost
  become: false
  changed_when: true
  notify: restart vpn-bot
  tags: [deploy, bot]

- name: Set bot app directory ownership
  file:
    path: "{{ bot_app_dir }}"
    state: directory
    owner: "{{ bot_user }}"
    group: "{{ bot_group }}"
    recurse: true
  tags: [deploy, bot]

- name: Install all dependencies (pnpm workspace)
  command: pnpm install --frozen-lockfile
  args:
    chdir: "{{ bot_app_dir }}"
  environment:
    CI: "true"
  become: true
  become_user: "{{ bot_user }}"
  tags: [deploy, bot]

- name: Build shared package first
  command: pnpm --filter @vpn-relay/shared build
  args:
    chdir: "{{ bot_app_dir }}"
  become: true
  become_user: "{{ bot_user }}"
  tags: [deploy, bot]

- name: Build server and web packages
  command: pnpm --filter server --filter web build
  args:
    chdir: "{{ bot_app_dir }}"
  become: true
  become_user: "{{ bot_user }}"
  notify: restart vpn-bot
  tags: [deploy, bot]

- name: Resolve server country codes via GeoIP
  include_tasks: geoip.yml
  tags: [deploy, bot]

- name: Template .env configuration
  template:
    src: env.j2
    dest: "{{ bot_app_dir }}/.env"
    owner: "{{ bot_user }}"
    group: "{{ bot_group }}"
    mode: "0600"
  no_log: true
  notify: restart vpn-bot
  tags: [deploy, bot]

- name: Create backup directory
  file:
    path: "{{ bot_backup_dir }}"
    state: directory
    owner: "{{ bot_user }}"
    group: "{{ bot_group }}"
    mode: "0700"
  tags: [deploy, bot]

# Generate-if-missing, mirroring roles/singbox_server/tasks/keys.yml. Idempotence is
# load-bearing beyond the usual reason: regenerating this would orphan every bundle
# already sitting in the admin's Telegram history.
- name: Check for existing backup passphrase
  stat:
    path: "{{ bot_backup_passphrase_file }}"
  register: _backup_passphrase_stat
  tags: [deploy, bot]

- name: Generate backup passphrase
  when: not _backup_passphrase_stat.stat.exists
  no_log: true
  block:
    - name: Generate random backup passphrase
      command: openssl rand -hex 24
      register: _backup_passphrase_gen
      changed_when: true

    - name: Write backup passphrase
      copy:
        content: "{{ _backup_passphrase_gen.stdout }}\n"
        dest: "{{ bot_backup_passphrase_file }}"
        owner: "{{ bot_user }}"
        group: "{{ bot_group }}"
        mode: "0400"
  tags: [deploy, bot]

- name: Set ACL — vpn-bot execute on xray keys dir (traverse to read files)
  acl:
    path: "{{ xray_keys_dir }}"
    entity: "{{ bot_user }}"
    etype: user
    permissions: x
    state: present
  tags: [deploy, bot]

- name: Set ACL — vpn-bot reads XRay keys
  acl:
    path: "{{ item }}"
    entity: "{{ bot_user }}"
    etype: user
    permissions: r
    state: present
  loop:
    - "{{ xray_keys_dir }}/reality.pub"
    - "{{ xray_keys_dir }}/shortid"
  tags: [deploy, bot]

# The Reality PRIVATE key, for the backup bundle. Without it a from-scratch restore
# regenerates the keypair, every distributed client URI's `pbk` changes, and every
# client breaks — which is the whole reason backups are a bundle and not just the DB.
#
# This does not widen the trust boundary: /etc/xray/config.json is owned by vpn-bot
# (see the config ACLs below) and already contains this exact value in
# realitySettings.privateKey. The bot possesses the secret either way; this only lets
# it read the canonical copy instead of scraping its own config.
- name: Set ACL — vpn-bot reads the Reality private key (for backup bundles)
  acl:
    path: "{{ xray_keys_dir }}/reality.key"
    entity: "{{ bot_user }}"
    etype: user
    permissions: r
    state: present
  tags: [deploy, bot]

- name: Set ACL — vpn-bot write-execute on xray config dir (needed to create temp files)
  acl:
    path: "{{ xray_config_dir }}"
    entity: "{{ bot_user }}"
    etype: user
    permissions: wx
    state: present
  tags: [deploy, bot]

- name: Set ACL — vpn-bot reads/writes config.json
  acl:
    path: "{{ xray_config_dir }}/config.json"
    entity: "{{ bot_user }}"
    etype: user
    permissions: rw
    state: present
  tags: [deploy, bot]

# Hysteria 2 (sing-box) ACLs — mirror the XRay block above so the bot can rebuild
# /etc/sing-box/config.json atomically. Gated on hy2_enabled: on non-Hy2 hosts the
# directory does not exist and ProtectSystem=strict would refuse the ReadWritePath.
- name: Set ACL — vpn-bot execute on sing-box config dir (traverse to read files)
  acl:
    path: "{{ singbox_config_dir }}"
    entity: "{{ bot_user }}"
    etype: user
    permissions: x
    state: present
  when: hy2_enabled | default(false) | bool
  tags: [deploy, bot]

- name: Set ACL — vpn-bot reads sing-box obfs password
  acl:
    path: "{{ singbox_obfs_file }}"
    entity: "{{ bot_user }}"
    etype: user
    permissions: r
    state: present
  when: hy2_enabled | default(false) | bool
  tags: [deploy, bot]

- name: Set ACL — vpn-bot write-execute on sing-box config dir (needed to create temp files)
  acl:
    path: "{{ singbox_config_dir }}"
    entity: "{{ bot_user }}"
    etype: user
    permissions: wx
    state: present
  when: hy2_enabled | default(false) | bool
  tags: [deploy, bot]

- name: Set ACL — vpn-bot reads/writes sing-box config.json
  acl:
    path: "{{ singbox_config_file }}"
    entity: "{{ bot_user }}"
    etype: user
    permissions: rw
    state: present
  when: hy2_enabled | default(false) | bool
  tags: [deploy, bot]
