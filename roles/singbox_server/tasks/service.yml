---
# Install systemd unit + certbot deploy-hook and manage the sing-box service.

- name: Template sing-box systemd unit
  ansible.builtin.template:
    src: sing-box.service.j2
    dest: /etc/systemd/system/sing-box.service
    mode: '0644'
    owner: root
    group: root
  notify: restart sing-box

# sing-box watches the cert path with fsnotify, but certbot renewal swaps the
# live/ symlinks to new files in archive/, which the watcher may miss. The
# deploy-hook restart is belt-and-suspenders (see spec F5).
- name: Ensure certbot deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Install certbot deploy-hook to restart sing-box
  ansible.builtin.template:
    src: restart-sing-box.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/restart-sing-box
    mode: '0755'
    owner: root
    group: root

- name: Enable and start sing-box service
  ansible.builtin.systemd:
    name: sing-box
    enabled: true
    state: started
    daemon_reload: true
