syntax = "proto3";

// Minimal subset of the v2ray/sing-box stats gRPC surface.
//
// sing-box's experimental v2ray_api registers this service under the v2ray v5
// name "v2ray.core.app.stats.command.StatsService" (see sing-box
// experimental/v2rayapi/stats.go). The xray CLI registers the SAME rpc under
// "xray.app.stats.command.StatsService", so it cannot talk to sing-box —
// hence the bot ships this proto and calls sing-box over gRPC directly.
package v2ray.core.app.stats.command;

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
  repeated string patterns = 3;
  bool regexp = 4;
}

message Stat {
  string name = 1;
  int64 value = 2;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
}
