---
# sing-box (Hysteria 2) server role defaults.
#
# Ports and cross-role shared vars (hy2_port, hy2_domain, hy2_host,
# singbox_version, singbox_v2ray_api_port, singbox_log_level) live in
# group_vars/all.yml — the single source of truth. Do NOT set ports here.

# Paths
singbox_bin: "/usr/local/bin/sing-box"
singbox_config_dir: "/etc/sing-box"
singbox_config_file: "/etc/sing-box/config.json"
singbox_obfs_file: "/etc/sing-box/obfs.pw"

# Build parameters — sing-box must be built from source: official release binaries
# do NOT include with_v2ray_api (needed for per-user stats). with_quic enables Hy2,
# with_utls the uTLS fingerprinting used by the QUIC/TLS stack.
singbox_build_tags: "with_quic,with_utls,with_v2ray_api"
# Go toolchain used for the build. Must be >= the `go`/`toolchain` directive in the
# pinned sing-box tag's go.mod. GOTOOLCHAIN defaults to `auto`, so a newer required
# toolchain is fetched automatically if this pin is slightly behind.
singbox_go_version: "1.24.4"

# Firewall management mode (shared with other roles)
# - "keep":    UFW enabled, add allow rule via ufw module
# - "disable": UFW disabled, use iptables INPUT rule
manage_ufw: "keep"

# WAN interface — leave empty for auto-detection (unused today; kept for parity)
wan_if: ""

# Rollback safety gate: also remove key material (obfs password) on teardown
singbox_remove_keys: false
