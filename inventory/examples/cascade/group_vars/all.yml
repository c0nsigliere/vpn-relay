---
# =============================================================================
# Cascade Deployment — Shared Variables (all hosts)
# =============================================================================
# Copy this directory to inventory/<your-deployment>/ and fill in real values.
#
# Role-specific overrides go in their own files:
#   wg_cascade.yml   — WireGuard cascade settings
#   relay_servers.yml — relay settings
#   xray_servers.yml  — XRay VLESS+Reality settings

# --- REQUIRED: Exit node public IP (used by cascade, relay, and bot) ---
server_b_public_ip: "YOUR_EXIT_NODE_PUBLIC_IP"

# --- REQUIRED: UUID authenticating the entry node's XRay to the exit node ---
# Generate with: python3 -c "import uuid; print(uuid.uuid4())"
xray_wg_uplink_uuid: "YOUR_UUID_HERE"

# --- Country codes (optional — auto-detected from server IPs via GeoIP at deploy) ---
# server_a_country: "RU"
# server_b_country: "NL"

# --- Firewall mode (applies to both nodes) ---
# "keep"    — UFW stays enabled; NAT rules in /etc/ufw/before.rules
# "disable" — UFW disabled; rules via iptables-persistent
manage_ufw: "keep"

# --- WAN interface override (comment out for auto-detection) ---
# wan_if: "eth0"

# --- Maintenance ---
do_dist_upgrade: false
manage_unattended_upgrades: "leave"
maintenance_reboot: true

# On-demand update/reboot from the bot & TMA. Shared by roles/maintenance (installs
# the root helper) and roles/telegram_bot (installs the path units that trigger it).
maintenance_agent_bin: /usr/local/sbin/vpn-maintenance
maintenance_state_dir: /var/lib/vpn-maintenance   # persistent: job status survives a reboot
maintenance_trigger_dir: /run/vpn-maintenance     # tmpfs: a trigger must NOT survive a reboot

# --- Telegram Bot (optional — deploy with deploy_bot.yml) ---
# Create a bot via @BotFather; get your admin chat ID from @userinfobot
# bot_telegram_token: "YOUR_BOT_TOKEN"
# bot_admin_id: "YOUR_TELEGRAM_USER_ID"

# --- Telegram Mini App (optional — deploy with deploy_tma.yml) ---
# tma_domain: "tma.example.com"
# tma_certbot_email: "you@example.com"
tma_https_port: 8444
tma_backend_port: 3000

# --- Ports ---
# DPI evasion: both entry and exit use 443 to look like normal HTTPS
xray_port: 443
port_a_tcp: 443
port_b_tcp: "{{ xray_port }}"

# WireGuard client-facing port on entry node
wg_clients_port: 51888

# TPROXY port for WireGuard traffic interception on entry node
xray_tproxy_port: 12345
xray_tproxy_table: 100

# --- XRay version ---
xray_version: "26.2.6"

# --- Hysteria 2 relay (phase 4) — only takes effect when hy2_enabled: true ---
# Entry node UDP relay port and its target on the exit node's sing-box.
# Client dials A:port_a_udp/udp; A does a pure L4 DNAT to B:port_b_udp/udp.
# hy2_enabled: true
# hy2_port: 443
# hy2_domain: "{{ tma_domain | default('') }}"
# hy2_host: "{{ server_b_public_ip }}"
# singbox_version: "1.13.14"
# singbox_v2ray_api_port: 10086
# singbox_log_level: "info"
port_a_udp: 443
port_b_udp: "{{ hy2_port | default(443) }}"

# --- WG cascade over Hy2 (phase 3) — the entry node tunnels wg-clients traffic
# to the exit node over Hysteria 2 instead of VLESS. Set a strong shared secret
# (also becomes the bot's HY2_UPLINK_PASSWORD → static user wg-clients@hy2 on B).
# Empty leaves the cascade on the VLESS uplink. Generate with:
#   python3 -c "import secrets; print(secrets.token_hex(16))"
# hy2_uplink_password: ""

# --- Backups (roles/telegram_bot) ---
# The bot builds a daily AES-256-GCM DR bundle (DB + Reality keys + Hy2 obfs
# password + Server A's WG server key), sends it to the admin's Telegram chat and
# keeps the last N locally in {{ bot_data_dir }}/backups.
#
# The encryption passphrase is generated once by Ansible into
# {{ bot_data_dir }}/backup.passphrase (0400). SAVE IT OFF THE NODE — without it
# the bundles are unreadable. The bot reminds you once, in chat, after the first
# successful run. See "Backups & Restore" in README.md.
#
# All three are role defaults; uncomment only to override.
# backup_enabled: true
# backup_hour_utc: 3       # UTC hour of the daily run
# backup_retention: 7      # local bundles kept before the oldest is rotated out
